<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="white"/>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#102a43}
    .head{font:700 27px Arial,sans-serif;fill:#102a43}
    .axis{font:700 22px Arial,sans-serif;fill:#102a43}
    .note{font:500 20px Arial,sans-serif;fill:#486581}
    .scl{stroke:#1f4e79;stroke-width:6;fill:none}
    .sda{stroke:#c53030;stroke-width:6;fill:none}
    .grid{stroke:#bcccdc;stroke-width:1;stroke-dasharray:5 6}
    .start{fill:#fff5f5;stroke:#c53030;stroke-width:2;rx:8}
    .stop{fill:#e6fffa;stroke:#2c7a7b;stroke-width:2;rx:8}
  </style>
  <text x="600" y="55" text-anchor="middle" class="title">I²C START 与 STOP 条件</text>

  <!-- START -->
  <text x="120" y="120" class="head">START 条件</text>
  <text x="120" y="155" class="note">SCL 保持高电平时，SDA 由高变低</text>
  <text x="55" y="235" class="axis">SCL</text><text x="55" y="335" class="axis">SDA</text>
  <line x1="180" y1="220" x2="1050" y2="220" class="grid"/><line x1="180" y1="320" x2="1050" y2="320" class="grid"/>
  <path d="M180 220 H950" class="scl"/>
  <path d="M180 320 H560 V220 H950" class="sda"/>
  <rect x="510" y="180" width="150" height="45" class="start"/>
  <text x="585" y="211" text-anchor="middle" class="axis" fill="#c53030">START</text>

  <!-- STOP -->
  <text x="120" y="445" class="head">STOP 条件</text>
  <text x="120" y="480" class="note">SCL 保持高电平时，SDA 由低变高</text>
  <text x="55" y="560" class="axis">SCL</text><text x="55" y="660" class="axis">SDA</text>
  <line x1="180" y1="545" x2="1050" y2="545" class="grid"/><line x1="180" y1="645" x2="1050" y2="645" class="grid"/>
  <path d="M180 545 H950" class="scl"/>
  <path d="M180 645 H560 V545 H950" class="sda"/>
  <rect x="510" y="505" width="150" height="45" class="stop"/>
  <text x="585" y="536" text-anchor="middle" class="axis" fill="#2c7a7b">STOP</text>
</svg>
